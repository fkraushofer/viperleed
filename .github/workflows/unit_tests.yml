# Fast tests: the default test tier (pytest's addopts select
# -m "not tensorleed", slow tests included) on every pull request and
# on every push to master. The TensErLEED-dependent tests run in
# tensorleed_tests.yml instead.
#
# - The tests run with --require-all: the optional dependencies
#   (PyQt5, gfortran/mpifort) are installed, so a test that would skip
#   for lack of one fails instead.
# - Python versions: the oldest and the newest offered by
#   actions/setup-python on ubuntu-latest on which the test
#   requirements and the GUI extra install.
# - Coverage is uploaded to Codecov from the newest-Python job. This
#   needs the Codecov app and the CODECOV_TOKEN secret. A failed upload
#   does not fail the job.
# - Require the check "Fast tests" (job all-fast-tests) in the
#   rulesets: it fails unless every job of the matrix succeeded, and
#   its name does not change with the Python versions.

name: Fast tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # PyQt5 without a display
  QT_QPA_PLATFORM: offscreen

jobs:
  pytest:
    name: Fast tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - python-version: '3.15'
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements/tests.txt
      - name: Install compilers, MPI, and the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libopenmpi-dev openmpi-bin \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libcairo2-dev pkg-config
      - name: Install viperleed and the test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/tests.txt -e '.[GUI]'
      - name: Run the default test tier
        env:
          # Coverage only where it is uploaded
          COVERAGE_OPTIONS: ${{ matrix.coverage && '--cov-report=xml' || '--no-cov' }}
        run: pytest tests -n auto --require-all -rfEs $COVERAGE_OPTIONS
      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  all-fast-tests:
    # A single, stable check name for the rulesets. Runs even if a
    # matrix job failed or was cancelled, so that it is never skipped.
    name: Fast tests
    if: ${{ always() }}
    needs: pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check that every matrix job succeeded
        env:
          RESULT: ${{ needs.pytest.result }}
        run: |
          echo "Matrix result: $RESULT"
          test "$RESULT" = success
